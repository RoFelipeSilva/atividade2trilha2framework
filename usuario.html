<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>PegPag - Usuários</title><style>body{font-family:Arial;max-width:1100px;margin:30px auto}input{display:block;width:100%;margin:6px 0 12px;padding:8px}button,a{padding:8px 12px;margin:3px;text-decoration:none}.card{padding:20px;border:1px solid #ddd;margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd}.danger{background:#a11;color:white}</style></head><body><a href="{{url_for('index')}}">Início</a><div class="card"><h1>Usuários</h1><form action="{{url_for('criarusuario')}}" method="post"><label>Nome</label><input name="nome" required><label>E-mail</label><input name="email" required><label>CPF</label><input name="cpf"><label>Endereço</label><input name="endereco"><label>Senha</label><input name="senha" required><button>Cadastrar</button></form></div><div class="card"><table><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>CPF</th><th>Ações</th></tr>{% for u in usuarios %}<tr><td>{{u.id}}</td><td>{{u.nome}}</td><td>{{u.email}}</td><td>{{u.cpf}}</td><td><a href="{{url_for('buscarusuario',id=u.id)}}">Ver</a><a href="{{url_for('editarusuario',id=u.id)}}">Editar</a><form style="display:inline" method="post" action="{{url_for('deletarusuario',id=u.id)}}"><button class="danger" onclick="return confirm('Confirma a exclusão?')">Excluir</button></form></td></tr>{% else %}<tr><td colspan="5">Nenhum registro.</td></tr>{% endfor %}</table></div></body></html>
