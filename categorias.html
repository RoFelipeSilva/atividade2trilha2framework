<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>PegPag - Categorias</title><style>body{font-family:Arial;max-width:1000px;margin:30px auto}input{padding:8px;width:70%}button,a{padding:8px 12px;margin:3px}.card{padding:20px;border:1px solid #ddd;margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd}.danger{background:#a11;color:white}</style></head><body><a href="{{url_for('index')}}">Início</a><div class="card"><h1>Categorias</h1><form method="post" action="{{url_for('cadcategorias')}}"><input name="descricao" placeholder="Descrição" required><button>Cadastrar</button></form></div><div class="card"><table><tr><th>ID</th><th>Descrição</th><th>Ações</th></tr>{% for c in categorias %}<tr><td>{{c.id}}</td><td>{{c.descricao}}</td><td><a href="{{url_for('editarcategoria',id=c.id)}}">Editar</a><form style="display:inline" method="post" action="{{url_for('deletarcategoria',id=c.id)}}"><button class="danger" onclick="return confirm('Confirma a exclusão?')">Excluir</button></form></td></tr>{% else %}<tr><td colspan="3">Nenhuma categoria.</td></tr>{% endfor %}</table></div></body></html>
