<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PegPag - {{ titulo or 'Sistema' }}</title>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#222}
        nav{background:#17365d;padding:15px} nav a{color:#fff;text-decoration:none;margin-right:14px;font-weight:bold}
        main{max-width:1150px;margin:28px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
        table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#eef3f8}
        input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 14px}textarea{min-height:80px}
        .btn{display:inline-block;padding:9px 13px;border:0;border-radius:6px;background:#17365d;color:#fff;text-decoration:none;cursor:pointer;margin-right:5px}
        .danger{background:#a61b1b}.secondary{background:#68737d}.success{background:#287a3e}.flash{background:#dff0d8;padding:12px;border-radius:6px;margin-bottom:15px}
        .actions{white-space:nowrap}.muted{color:#666}
    </style>
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">PegPag</a>
    <a href="{{ url_for('usuario') }}">Usuários</a>
    <a href="{{ url_for('categorias') }}">Categorias</a>
    <a href="{{ url_for('anuncio') }}">Anúncios</a>
    <a href="{{ url_for('perguntas') }}">Perguntas</a>
    <a href="{{ url_for('compras') }}">Compras</a>
    <a href="{{ url_for('favoritos') }}">Favoritos</a>
</nav>
<main>
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
