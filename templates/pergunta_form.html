{% extends 'base.html' %}{% block content %}<div class="card"><h1>{{ titulo }}</h1><form method="post"><label>Pergunta</label><textarea name="pergunta" required>{{pergunta.pergunta}}</textarea><label>Resposta</label><textarea name="resposta">{{pergunta.resposta}}</textarea><label>Anúncio</label><select name="anuncio_id">{% for a in anuncios %}<option value="{{a.id}}" {% if pergunta.anuncio_id==a.id %}selected{% endif %}>{{a.titulo}}</option>{% endfor %}</select><label>Usuário</label><select name="usuario_id">{% for u in usuarios %}<option value="{{u.id}}" {% if pergunta.usuario_id==u.id %}selected{% endif %}>{{u.nome}}</option>{% endfor %}</select><button class="btn">Salvar</button></form></div>{% endblock %}
