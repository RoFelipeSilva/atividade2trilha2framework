{% extends 'base.html' %}{% block content %}<div class="card"><h1>Anúncios</h1><form method="post" action="{{url_for('cadanuncio')}}"><label>Título</label><input name="titulo" required><label>Descrição</label><textarea name="descricao"></textarea><label>Valor</label><input name="valor" type="number" step="0.01" required><label>Quantidade</label><input name="qtde" type="number" required><label>Oferta</label><input name="oferta"><label>Categoria ID</label><input name="categoria_id"><label>Usuário ID</label><input name="usuario_id"><button class="btn success">Cadastrar</button></form></div><div class="card"><table><tr><th>ID</th><th>Título</th><th>Valor</th><th>Qtd.</th><th>Ações</th></tr>{% for a in anuncios %}<tr><td>{{a.id}}</td><td>{{a.titulo}}</td><td>{{a.valor}}</td><td>{{a.qtde}}</td><td><a class="btn secondary" href="{{url_for('buscaranuncio',id=a.id)}}">Ver</a><a class="btn" href="{{url_for('editaranuncio',id=a.id)}}">Editar</a><form method="post" action="{{url_for('deletaranuncio',id=a.id)}}" style="display:inline"><button class="btn danger" onclick="return confirm('Confirma a exclusão?')">Excluir</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
