{% extends 'base.html' %}{% block content %}<div class="card"><h1>Categorias</h1><form method="post" action="{{url_for('cadcategorias')}}"><label>Descrição</label><input name="descricao" required><button class="btn success">Cadastrar</button></form></div><div class="card"><table><tr><th>ID</th><th>Descrição</th><th>Ações</th></tr>{% for c in categorias %}<tr><td>{{c.id}}</td><td>{{c.descricao}}</td><td><a class="btn" href="{{url_for('editarcategoria',id=c.id)}}">Editar</a><form method="post" action="{{url_for('deletarcategoria',id=c.id)}}" style="display:inline" onsubmit="return confirm('Confirma a exclusão?')"><button class="btn danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="3">Nenhuma categoria cadastrada.</td></tr>{% endfor %}</table></div>{% endblock %}
