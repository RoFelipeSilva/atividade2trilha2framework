{% extends 'base.html' %}{% block content %}<div class="card"><h1>Compras</h1><p>Cadastro e gerenciamento de compras.</p><a class="btn" href="{{url_for('criarcompra')}}">Novo</a></div><div class="card"><table><tr><th>ID</th><th>Quantidade</th><th>Valor</th><th>Total</th><th>Ações</th></tr>{% for c in compras %}<tr><td>{{c.id}}</td><td>{{c.qtde}}</td><td>{{c.valor}}</td><td>{{c.total}}</td><td><a class="btn" href="{{url_for('editarcompra',id=c.id)}}">Editar</a><form method="post" action="{{url_for('deletarcompra',id=c.id)}}" style="display:inline"><button class="btn danger" onclick="return confirm('Confirma a exclusão?')">Excluir</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
