{% extends 'base.html' %}{% block content %}
<div class="card"><h1>Usuários</h1><form method="post" action="{{ url_for('criarusuario') }}"><label>Nome</label><input name="nome" required><label>E-mail</label><input name="email" type="email" required><label>CPF</label><input name="cpf"><label>Endereço</label><input name="end"><label>Senha</label><input name="senha" required><button class="btn success">Cadastrar</button></form></div>
<div class="card"><h2>Registros cadastrados</h2><table><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>CPF</th><th>Ações</th></tr>{% for u in usuarios %}<tr><td>{{u.id}}</td><td>{{u.nome}}</td><td>{{u.email}}</td><td>{{u.cpf}}</td><td class="actions"><a class="btn secondary" href="{{url_for('buscarusuario',id=u.id)}}">Ver</a><a class="btn" href="{{url_for('editarusuario',id=u.id)}}">Editar</a><form method="post" action="{{url_for('deletarusuario',id=u.id)}}" style="display:inline" onsubmit="return confirm('Confirma a exclusão?')"><button class="btn danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="5">Nenhum usuário cadastrado.</td></tr>{% endfor %}</table></div>{% endblock %}
