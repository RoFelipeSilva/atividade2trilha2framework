{% extends 'base.html' %}{% block content %}<div class="card"><h1>Favoritos</h1><form method="post" action="{{url_for('criarfavorito')}}"><label>Usuário</label><select name="usuario_id" required>{% for u in usuarios %}<option value="{{u.id}}">{{u.nome}}</option>{% endfor %}</select><label>Anúncio</label><select name="anuncio_id" required>{% for a in anuncios %}<option value="{{a.id}}">{{a.titulo}}</option>{% endfor %}</select><button class="btn success">Cadastrar</button></form></div><div class="card"><table><tr><th>ID</th><th>Usuário</th><th>Anúncio</th><th>Ações</th></tr>{% for f in favoritos %}<tr><td>{{f.id}}</td><td>{{f.usuario_id}}</td><td>{{f.anuncio_id}}</td><td><a class="btn" href="{{url_for('editarfavorito',id=f.id)}}">Editar</a><form method="post" action="{{url_for('deletarfavorito',id=f.id)}}" style="display:inline"><button class="btn danger" onclick="return confirm('Confirma a exclusão?')">Excluir</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
